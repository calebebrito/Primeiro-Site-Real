<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versus</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body id="signUpBody">

    <div class="goHomeVs2" style="margin: 4px; font-size: 22pt; width: auto;">
        <a href="homeScreen.html">
            <p><i>VERSUS</i></p>
        </a>
    </div>

    <div class="signCard">
        <h1 class="signVs arial"><i>VS</i></h1>

        <p class="create arial">Create Account</p>

            <form id="signupForm">
                <div class="emailInput arial">
                    <img src="images/email-icon.png" alt="email icon">
                    <input id="signupEmail" type="email" placeholder="Email">
                </div>
                <span class="inputError" id="emailError"></span>
                
                <div class="passInput arial">
                    <img src="images/lock-icon.png" alt="lock icon">
                    <input id="signupPassword" type="password" placeholder="Password">
                </div>
                <span class="inputError" id="passwordError"></span>
                
                <div class="passInput arial">
                    <img src="images/lock-icon.png" alt="lock icon">
                    <input id="confirmPassword" type="password" placeholder="Confirm Password">
                </div>
                <span class="inputError" id="confirmPasswordError"></span>
                
                    <div class="g-recaptcha"
                        data-sitekey="6Lf8544sAAAAAGBhXIV1qGjpl5NZ4hB3LYSf314u">
                    </div>
                    <span class="captchaError" id="captchaError"></span>
                
                <button type="submit" class="createLogBut">
                    <p class="arial">Create Account</p>
                </button>
            </form>
    </div>

    <p class="alreadyLog arial">Already have an account?
         <a href="logInScreen.html" style="color: #0099ff;"> Login</a>
    </p>


    <script src="JS/signup.js"></script>
</body>
</html>
