<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="images/Captura_de_tela_2026-06-03_125115-removebg-preview.png" type="image/png">
    <title>Versus</title>
    <link rel="stylesheet" href="style.css">
</head>

<body id="loginBody">

    <div class="goHomeVs2" style="margin: 4px; font-size: 22pt; width: auto;">
        <a href="index.html">
            <p><i>VERSUS</i></p>
        </a>
    </div>

    <div class="logCard">
        <h1 class="signVs arial"><i>VS</i></h1>

        <p class="log arial">Log in</p>

            <form id="loginForm">
                <div class="emailInput arial">
                    <img src="images/email-icon.png" alt="email icon">
                    <input id="loginEmail" type="email" placeholder="Email" style="padding-top: 6px;">
                </div>
                <span class="inputError" id="emailError"></span>
                
                <div class="passInput arial">
                    <img src="images/lock-icon.png" alt="lock icon">
                    <input id="loginPassword" type="password" placeholder="Password" style="padding-top: 9px;">
                </div>
                <span class="inputError" id="passwordError"></span>

                <button type="submit" class="logBut">
                    <p class="arial">Log in</p>
                </button>
            </form>
    </div>

    <p class="alreadyLog arial">Do not have an account? <a href="signUpScreen.html" style="color: #0099ff;"> Create Account</a></p>


    <script src="JS/login.js"></script>
</body>
</html>
